name: Chess Bot
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: write
  issues: write
jobs:
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install python-chess
      - name: Play move
        id: play
        run: python .github/chess_bot.py
      - name: Commit board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/ || true
          git diff --cached --quiet || git commit -m "chess: move by @${{ github.event.issue.user.login }}"
          git push
      - name: Comment & close
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('comment.md') ? fs.readFileSync('comment.md','utf8') : 'Played.';
            await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
            await github.rest.issues.update({...context.repo, issue_number: context.issue.number, state: 'closed'});
